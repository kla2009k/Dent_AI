services:
  - type: web
    name: dentscan-ai-nemophila
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/kla2009k/Dent_AI
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: INFERENCE_BACKEND
        value: onnx
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
